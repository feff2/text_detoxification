[project]
name = "text-detoxification"
version = "0.1.0"
description = "Text detoxification model using Qwen3 for multilingual toxic text rewriting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.16.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "unsloth[colab-new]>=2024.4",
    "trl>=0.7.0",
    "pytorch-lightning>=2.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "mlflow>=2.8.0",
    "dvc>=3.0.0",
    "dvc-s3>=3.0.0",
    "fire>=0.5.0",
    "tqdm>=4.66.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "accelerate>=0.25.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "matplotlib>=3.7.0",
    "pytriton>=0.5.0",
    "pycuda>=2022.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
    "pytest>=7.4.0",
    "mypy>=1.5.0",
]

[project.scripts]
text-detox = "text_detoxification.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

