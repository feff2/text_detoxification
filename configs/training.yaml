# Training configuration
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 2
warmup_steps: 10
num_train_epochs: 5
learning_rate: 2.0e-4
fp16: true
logging_steps: 10
eval_strategy: "steps"
eval_steps: 50
save_strategy: "steps"
save_steps: 50
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
optim: "adamw_8bit"
weight_decay: 0.01
lr_scheduler_type: "linear"
seed: 42
output_dir: "outputs"
dataset_num_proc: 2
packing: false

